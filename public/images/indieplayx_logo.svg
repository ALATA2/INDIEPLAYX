<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 140" width="100%" height="100%">
  <defs>
    <!-- Fiery Orange-Gold Gradients -->
    <linearGradient id="ipx-fire-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="25%" stop-color="#ffaa00"/>
      <stop offset="65%" stop-color="#ff4d00"/>
      <stop offset="100%" stop-color="#991800"/>
    </linearGradient>
    <linearGradient id="ipx-fire-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffd04d"/>
      <stop offset="75%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#cc2900"/>
    </linearGradient>
    <linearGradient id="ipx-fire-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8000"/>
      <stop offset="55%" stop-color="#c82800"/>
      <stop offset="100%" stop-color="#520a00"/>
    </linearGradient>

    <!-- Electric Cyan-Blue Gradients -->
    <linearGradient id="ipx-ice-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8fdff"/>
      <stop offset="28%" stop-color="#00e1ff"/>
      <stop offset="68%" stop-color="#0077ff"/>
      <stop offset="100%" stop-color="#002670"/>
    </linearGradient>
    <linearGradient id="ipx-ice-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#6eeeff"/>
      <stop offset="80%" stop-color="#0095ff"/>
      <stop offset="100%" stop-color="#0044b3"/>
    </linearGradient>
    <linearGradient id="ipx-ice-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bfff"/>
      <stop offset="58%" stop-color="#0055cc"/>
      <stop offset="100%" stop-color="#00194d"/>
    </linearGradient>

    <!-- Side Ring Split Gradient (Orange Top -> Cyan Bottom) -->
    <linearGradient id="ipx-ring-split" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="28%" stop-color="#ff4800"/>
      <stop offset="46%" stop-color="#7ceeff"/>
      <stop offset="75%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#0044aa"/>
    </linearGradient>

    <!-- Chrome Silver Metallic Gradient for "INDIE" -->
    <linearGradient id="ipx-chrome-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#e2ecf5"/>
      <stop offset="48%" stop-color="#8b9eb0"/>
      <stop offset="53%" stop-color="#f8fbff"/>
      <stop offset="82%" stop-color="#b8c7d6"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="ipx-chrome-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Electric Blue Metallic Gradient for "PLAY" -->
    <linearGradient id="ipx-blue-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ebfcff"/>
      <stop offset="22%" stop-color="#4de8ff"/>
      <stop offset="48%" stop-color="#0080f0"/>
      <stop offset="53%" stop-color="#80f2ff"/>
      <stop offset="82%" stop-color="#0095ff"/>
      <stop offset="100%" stop-color="#003d99"/>
    </linearGradient>
    <linearGradient id="ipx-blue-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b4ff"/>
      <stop offset="50%" stop-color="#004499"/>
      <stop offset="100%" stop-color="#001538"/>
    </linearGradient>

    <filter id="ipx-shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#ipx-shadow)">
    <!-- ==================== 1. LEFT CIRCULAR EMBLEM ==================== -->
    <!-- Top Orange-Gold Ring Segment -->
    <path d="M 33 25 A 59 59 0 0 1 107 25 L 98 36 A 45 45 0 0 0 42 36 Z"
          fill="url(#ipx-fire-main)" stroke="#4a1000" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 37 28 A 54 54 0 0 1 103 28" fill="none" stroke="#fff7cc" stroke-width="1.5" opacity="0.9"/>

    <!-- Bottom Cyan-Blue Ring Segment -->
    <path d="M 42 106 A 45 45 0 0 0 98 106 L 107 117 A 59 59 0 0 1 33 117 Z"
          fill="url(#ipx-ice-main)" stroke="#001b4d" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 38 113 A 54 54 0 0 0 102 113" fill="none" stroke="#bdf8ff" stroke-width="1.4" opacity="0.9"/>

    <!-- Left Split Ring Segment -->
    <path d="M 19 43 L 30 49 A 45 45 0 0 0 30 95 L 19 102 A 59 59 0 0 1 19 43 Z"
          fill="url(#ipx-ring-split)" stroke="#091e3a" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Right Split Ring Segment -->
    <path d="M 121 43 A 59 59 0 0 1 121 102 L 110 95 A 45 45 0 0 0 110 49 Z"
          fill="url(#ipx-ring-split)" stroke="#091e3a" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- Upper V-Winged Crystal (Fiery Orange-Gold) -->
    <!-- Left Wing -->
    <polygon points="11,26 52,44 70,58 70,74 42,54" fill="url(#ipx-fire-bright)" stroke="#4a1000" stroke-width="1.2"/>
    <polygon points="11,26 42,54 55,69 45,50" fill="url(#ipx-fire-shade)" stroke="#4a1000" stroke-width="1.1"/>
    <!-- Right Wing -->
    <polygon points="129,26 88,44 70,58 70,74 98,54" fill="url(#ipx-fire-main)" stroke="#4a1000" stroke-width="1.2"/>
    <polygon points="129,26 98,54 85,69 95,50" fill="url(#ipx-fire-shade)" stroke="#4a1000" stroke-width="1.1"/>
    <!-- Inner V Highlight -->
    <polyline points="17,30 70,66 123,30" fill="none" stroke="#fff9db" stroke-width="1.5" opacity="0.9"/>

    <!-- Lower Inverted-V Spikes (Electric Cyan-Blue) -->
    <!-- Left Spike -->
    <polygon points="48,66 60,78 21,118 40,81" fill="url(#ipx-ice-bright)" stroke="#001a4d" stroke-width="1.2"/>
    <polygon points="48,66 40,81 21,118 34,74" fill="url(#ipx-ice-shade)" stroke="#001a4d" stroke-width="1.1"/>
    <!-- Right Spike -->
    <polygon points="92,66 80,78 119,118 100,81" fill="url(#ipx-ice-main)" stroke="#001a4d" stroke-width="1.2"/>
    <polygon points="92,66 100,81 119,118 106,74" fill="url(#ipx-ice-shade)" stroke="#001a4d" stroke-width="1.1"/>

    <!-- Bottom Center Triangle Prism -->
    <polygon points="70,80 51,102 89,102" fill="url(#ipx-ice-bright)" stroke="#001d52" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="70,80 70,102 89,102" fill="url(#ipx-ice-shade)" opacity="0.65"/>

    <!-- ==================== 2. "INDIE" 3D BEVELLED VECTOR LETTERS ==================== -->
    <g id="ipx-word-indie">
      <!-- Bevel Base (3D Extrusion) -->
      <path fill="url(#ipx-chrome-bevel)" stroke="#0f172a" stroke-width="3.2" stroke-linejoin="round" d="
        M146,46 L160,46 L160,94 L146,94 Z
        M167,94 L167,46 L180,46 L193,73 L193,46 L205,46 L205,94 L192,94 L179,67 L179,94 Z
        M213,46 L241,46 L251,55 L251,85 L241,94 L213,94 Z M226,57 L226,83 L236,83 L239,80 L239,60 L236,57 Z
        M259,46 L273,46 L273,94 L259,94 Z
        M281,46 L317,46 L317,57 L294,57 L294,65 L314,65 L314,75 L294,75 L294,83 L317,83 L317,94 L281,94 Z
      " fill-rule="evenodd"/>
      <!-- Metallic Chrome Front Face -->
      <path fill="url(#ipx-chrome-face)" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.7" d="
        M146,46 L160,46 L160,94 L146,94 Z
        M167,94 L167,46 L180,46 L193,73 L193,46 L205,46 L205,94 L192,94 L179,67 L179,94 Z
        M213,46 L241,46 L251,55 L251,85 L241,94 L213,94 Z M226,57 L226,83 L236,83 L239,80 L239,60 L236,57 Z
        M259,46 L273,46 L273,94 L259,94 Z
        M281,46 L317,46 L317,57 L294,57 L294,65 L314,65 L314,75 L294,75 L294,83 L317,83 L317,94 L281,94 Z
      " fill-rule="evenodd"/>
    </g>

    <!-- ==================== 3. "PLAY" 3D BEVELLED VECTOR LETTERS ==================== -->
    <g id="ipx-word-play">
      <!-- Bevel Base -->
      <path fill="url(#ipx-blue-bevel)" stroke="#001845" stroke-width="3.2" stroke-linejoin="round" d="
        M332,46 L360,46 L368,54 L368,69 L360,77 L345,77 L345,94 L332,94 Z M345,56 L345,67 L354,67 L356,65 L356,58 L354,56 Z
        M375,46 L388,46 L388,83 L409,83 L409,94 L375,94 Z
        M413,94 L426,46 L440,46 L453,94 L439,94 L437,84 L429,84 L427,94 Z M430,74 L436,74 L433,59 Z
        M454,46 L468,46 L473,63 L478,46 L492,46 L479,75 L479,94 L467,94 L467,75 Z
      " fill-rule="evenodd"/>
      <!-- Electric Blue Front Face -->
      <path fill="url(#ipx-blue-face)" stroke="#aef6ff" stroke-width="0.6" stroke-opacity="0.8" d="
        M332,46 L360,46 L368,54 L368,69 L360,77 L345,77 L345,94 L332,94 Z M345,56 L345,67 L354,67 L356,65 L356,58 L354,56 Z
        M375,46 L388,46 L388,83 L409,83 L409,94 L375,94 Z
        M413,94 L426,46 L440,46 L453,94 L439,94 L437,84 L429,84 L427,94 Z M430,74 L436,74 L433,59 Z
        M454,46 L468,46 L473,63 L478,46 L492,46 L479,75 L479,94 L467,94 L467,75 Z
      " fill-rule="evenodd"/>
    </g>

    <!-- ==================== 4. RIGHT STYLIZED "X" SPLIT BLADE ==================== -->
    <!-- Top-Left Blade (Electric Cyan-Blue) -->
    <polygon points="488,24 532,54 519,68 506,57" fill="url(#ipx-ice-bright)" stroke="#001d4d" stroke-width="1.3"/>
    <polygon points="488,24 506,57 519,68 511,70" fill="url(#ipx-ice-shade)" stroke="#001d4d" stroke-width="1.2"/>
    <!-- Bottom-Left Blade (Electric Cyan-Blue) -->
    <polygon points="488,116 511,70 519,72 506,83" fill="url(#ipx-ice-bright)" stroke="#001d4d" stroke-width="1.3"/>
    <polygon points="488,116 532,86 519,72 506,83" fill="url(#ipx-ice-shade)" stroke="#001d4d" stroke-width="1.2"/>

    <!-- Top-Right Blade (Fiery Orange-Gold) -->
    <polygon points="576,24 532,54 545,68 558,57" fill="url(#ipx-fire-bright)" stroke="#4a1000" stroke-width="1.3"/>
    <polygon points="576,24 558,57 545,68 553,70" fill="url(#ipx-fire-shade)" stroke="#4a1000" stroke-width="1.2"/>
    <!-- Bottom-Right Blade (Fiery Orange-Gold) -->
    <polygon points="576,116 553,70 545,72 558,83" fill="url(#ipx-fire-bright)" stroke="#4a1000" stroke-width="1.3"/>
    <polygon points="576,116 532,86 545,72 558,83" fill="url(#ipx-fire-shade)" stroke="#4a1000" stroke-width="1.2"/>

    <!-- Inner Bright X Frame & Central Diamond Cutout -->
    <polygon points="532,56 546,70 532,84 518,70" fill="#050b14" stroke="#ffffff" stroke-width="1.6"/>
  </g>
</svg>
