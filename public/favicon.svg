<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-fire-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="28%" stop-color="#ffaa00"/>
      <stop offset="68%" stop-color="#ff4d00"/>
      <stop offset="100%" stop-color="#991800"/>
    </linearGradient>
    <linearGradient id="fav-fire-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffd04d"/>
      <stop offset="75%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#cc2900"/>
    </linearGradient>
    <linearGradient id="fav-ice-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8fdff"/>
      <stop offset="28%" stop-color="#00e1ff"/>
      <stop offset="68%" stop-color="#0077ff"/>
      <stop offset="100%" stop-color="#002670"/>
    </linearGradient>
    <linearGradient id="fav-ice-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#6eeeff"/>
      <stop offset="80%" stop-color="#0095ff"/>
      <stop offset="100%" stop-color="#0044b3"/>
    </linearGradient>
    <linearGradient id="fav-ring-split" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="30%" stop-color="#ff4800"/>
      <stop offset="50%" stop-color="#7ceeff"/>
      <stop offset="100%" stop-color="#0055cc"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="132" height="132" rx="28" fill="#050b14" stroke="#1e293b" stroke-width="3"/>

  <!-- Top Orange-Gold Ring Segment -->
  <path d="M 33 25 A 59 59 0 0 1 107 25 L 98 36 A 45 45 0 0 0 42 36 Z" fill="url(#fav-fire-main)"/>
  <!-- Bottom Cyan-Blue Ring Segment -->
  <path d="M 42 106 A 45 45 0 0 0 98 106 L 107 117 A 59 59 0 0 1 33 117 Z" fill="url(#fav-ice-main)"/>
  <!-- Left & Right Split Rings -->
  <path d="M 19 43 L 30 49 A 45 45 0 0 0 30 95 L 19 102 A 59 59 0 0 1 19 43 Z" fill="url(#fav-ring-split)"/>
  <path d="M 121 43 A 59 59 0 0 1 121 102 L 110 95 A 45 45 0 0 0 110 49 Z" fill="url(#fav-ring-split)"/>

  <!-- Upper V-Winged Crystal (Fiery Orange-Gold) -->
  <polygon points="11,26 52,44 70,58 70,74 42,54" fill="url(#fav-fire-bright)"/>
  <polygon points="129,26 88,44 70,58 70,74 98,54" fill="url(#fav-fire-main)"/>
  <polyline points="17,30 70,66 123,30" fill="none" stroke="#fff9db" stroke-width="2" opacity="0.9"/>

  <!-- Lower Inverted-V Spikes (Electric Cyan-Blue) -->
  <polygon points="48,66 60,78 21,118 40,81" fill="url(#fav-ice-bright)"/>
  <polygon points="92,66 80,78 119,118 100,81" fill="url(#fav-ice-main)"/>

  <!-- Bottom Center Triangle Prism -->
  <polygon points="70,80 51,102 89,102" fill="url(#fav-ice-bright)"/>
</svg>
